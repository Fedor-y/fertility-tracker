[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "healthtracker"
version = "0.1.0.dev1"
description = "Локальный настольный HealthTracker: каркас, предметная логика и SQLite"
requires-python = ">=3.14,<3.15"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "pyinstaller==6.22.3"]

[project.scripts]
healthtracker = "healthtracker.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthtracker = ["resources/chart/*", "resources/chart/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
